[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxondroid"
version = "0.1.0"
description = "Windows GUI for managing the Android devices on your home network over ADB"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.gui-scripts]
maxondroid = "maxondroid.ui.app:main"

[tool.setuptools.packages.find]
include = ["maxondroid*"]

[tool.setuptools.package-data]
maxondroid = ["data/uad/*.json", "data/uad/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
