name: release

# A version tag (v1.2.3) builds the Windows installer, installs it silently for the
# current user, runs the installed app's self-test, uninstalls it and publishes the
# installer with its SHA-256. Pushes that touch the packaging run the same build and
# checks without publishing, so a broken installer shows up before the tag.

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "maxondroid/selftest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1" # the self-test reports contain Russian text; the runner console is cp1252
  # scrcpy (Apache-2.0) with its adb; the hash is the one of the file published by Genymobile
  SCRCPY_VERSION: "5.0.1"
  SCRCPY_SHA256: "b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5"
  # Inno Setup is no longer preinstalled on windows-latest; this exact installer is used instead
  INNO_VERSION: "6.7.3"
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
  APP_ID: "{402AB4A8-83CF-4C9F-97D5-55D3693A4B02}_is1"

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version must match the tag
        shell: python
        run: |
          import os, re, pathlib, sys
          text = pathlib.Path("maxondroid/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "(\d+\.\d+\.\d+)"', text).group(1)
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != "v" + version:
              sys.exit(f"tag {os.environ['GITHUB_REF_NAME']} does not match __version__ {version}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VERSION={version}\n")
          print("version", version)

      - name: Install the build tools (pinned by hash)
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r packaging/requirements-build.txt

      - name: Download scrcpy and check its SHA-256
        shell: python
        run: |
          import hashlib, os, pathlib, sys, urllib.request, zipfile
          version, expected = os.environ["SCRCPY_VERSION"], os.environ["SCRCPY_SHA256"]
          url = f"https://github.com/Genymobile/scrcpy/releases/download/v{version}/scrcpy-win64-v{version}.zip"
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "scrcpy.zip"
          urllib.request.urlretrieve(url, target)
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          if actual != expected:
              sys.exit(f"scrcpy SHA-256 mismatch: {actual} != {expected}")
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "scrcpy"
          with zipfile.ZipFile(target) as archive:
              archive.extractall(out)  # zipfile drops absolute paths and '..' parts
          print("scrcpy", version, "verified", actual)

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/maxondroid.spec

      - name: Put scrcpy next to the program
        shell: python
        run: |
          import os, pathlib, shutil
          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "scrcpy" / f"scrcpy-win64-v{os.environ['SCRCPY_VERSION']}"
          target = pathlib.Path("dist/MaxOnDroid/tools/scrcpy")
          shutil.copytree(source, target)
          for name in ("scrcpy.exe", "adb.exe", "scrcpy-server"):
              assert (target / name).is_file(), name
          print(sorted(p.name for p in target.iterdir()))

      - name: Self-test of the built folder
        timeout-minutes: 10
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "selftest-dist.json"
          rc = subprocess.run(["dist/MaxOnDroid/MaxOnDroid.exe", "--self-test", str(report), "--require-bundled"], timeout=300).returncode
          print(report.read_text(encoding="utf-8") if report.exists() else "no report")
          data = json.loads(report.read_text(encoding="utf-8"))
          if rc != 0 or not data["ok"] or not data["frozen"] or data["version"] != os.environ["VERSION"]:
              sys.exit(f"self-test failed (exit {rc})")

      - name: Install Inno Setup (pinned by hash and signature)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.','_')/innosetup-$env:INNO_VERSION.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup SHA-256 mismatch: $hash" }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") { throw "Inno Setup signature: $($signature.Status)" }
          Write-Host "signed by $($signature.SignerCertificate.Subject)"
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe missing" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\MaxOnDroid" packaging\maxondroid.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist\installer

      - name: A folder that needs administrator rights is refused
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = "dist\installer\MaxOnDroid-$env:VERSION-setup.exe"
          $dir = "C:\Program Files\MaxOnDroidAdminTest"
          $log = Join-Path $env:RUNNER_TEMP "install-admin.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LANG=english","/DIR=`"$dir`"","/LOG=`"$log`"" -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if ($p.ExitCode -eq 0) { throw "setup accepted $dir" }
          if (Test-Path "$dir\MaxOnDroid.exe") { throw "files were copied to $dir" }
          if (-not (Select-String -Path $log -Pattern "administrator rights" -Quiet)) { throw "the log does not explain the refusal" }

      - name: Silent per-user install
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = "dist\installer\MaxOnDroid-$env:VERSION-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "MaxOnDroid Test"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LANG=english","/DIR=`"$dir`"","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "install failed: $($p.ExitCode)" }
          foreach ($f in "MaxOnDroid.exe","tools\scrcpy\scrcpy.exe","tools\scrcpy\adb.exe","unins000.exe","LICENSE.txt","THIRD_PARTY_NOTICES.md") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $key = "Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_ID"
          if (-not (Test-Path "HKCU:\$key")) { throw "no per-user uninstall entry" }
          if (Test-Path "HKLM:\$key") { throw "installed for all users" }
          (Get-ItemProperty "HKCU:\$key").DisplayVersion
          "INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Self-test of the installed app
        timeout-minutes: 10
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          app = pathlib.Path(os.environ["INSTALL_DIR"]) / "MaxOnDroid.exe"
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "selftest-installed.json"
          rc = subprocess.run([str(app), "--self-test", str(report), "--require-bundled"], timeout=300).returncode
          print(report.read_text(encoding="utf-8") if report.exists() else "no report")
          data = json.loads(report.read_text(encoding="utf-8"))
          if rc != 0 or not data["ok"] or not data["frozen"]:
              sys.exit(f"installed self-test failed (exit {rc})")
          if pathlib.Path(data["executable"]).resolve() != app.resolve():
              sys.exit(f"self-test ran {data['executable']}, not the installed copy")

      - name: Silent uninstall removes the program
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dir = $env:INSTALL_DIR
          $p = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_ID"
          $deadline = (Get-Date).AddSeconds(120)
          while (((Test-Path "$dir\MaxOnDroid.exe") -or (Test-Path $key)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\MaxOnDroid.exe") { throw "program still there after uninstall" }
          if (Test-Path $key) { throw "uninstall entry still there" }
          Write-Host "uninstalled"

      - name: SHA-256 of the installer
        shell: python
        run: |
          import hashlib, os, pathlib
          setup = pathlib.Path(f"dist/installer/MaxOnDroid-{os.environ['VERSION']}-setup.exe")
          digest = hashlib.sha256(setup.read_bytes()).hexdigest()
          pathlib.Path(f"{setup}.sha256").write_text(f"{digest}  {setup.name}\n", encoding="utf-8")
          print(digest, setup.name, setup.stat().st_size)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            dist/installer/MaxOnDroid-*-setup.exe
            dist/installer/MaxOnDroid-*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: out
      - name: Check the hash file again
        working-directory: out
        run: sha256sum --check --strict MaxOnDroid-*-setup.exe.sha256
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          setup="MaxOnDroid-${version}-setup.exe"
          digest="$(cut -d' ' -f1 "out/${setup}.sha256")"
          {
            echo "## MaxOnDroid ${version}"
            echo
            echo "Installer for Windows 10 and 11 (64-bit), for the current user, without administrator rights. Includes scrcpy ${SCRCPY_VERSION} with adb."
            echo "Установщик для Windows 10 и 11 (64-бит), для текущего пользователя, без прав администратора. Внутри scrcpy ${SCRCPY_VERSION} с adb."
            echo
            echo "**SHA-256** \`${setup}\`:"
            echo
            echo "\`\`\`"
            echo "${digest}"
            echo "\`\`\`"
            echo
            echo "Check / проверка (PowerShell): \`(Get-FileHash .\\${setup}).Hash\` or / или \`certutil -hashfile ${setup} SHA256\`"
            echo
            echo "The installer is not code-signed, so Windows SmartScreen may warn: More info → Run anyway. See the README."
            echo "Установщик не подписан, поэтому SmartScreen может предупредить: «Подробнее» → «Выполнить в любом случае». Подробности в README."
            echo
            awk -v v="## ${version}" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "out/MaxOnDroid-${version}-setup.exe" "out/MaxOnDroid-${version}-setup.exe.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "MaxOnDroid ${version}" --notes-file notes.md --verify-tag
